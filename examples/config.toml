# Copy to ~/.config/agent-sandbox/config.toml or /etc/agent-sandbox/config.toml

# "podman" or "docker". Auto-detected (podman first) when unset.
# engine = "podman"

[agent]
# Exactly one of `image`, `build_file` and `build`. Either an image name...
image = "localhost/claude-code:latest"
# ...or a Dockerfile, as a path (relative to this file, ~ works) or inline.
# It is built once and tagged with a hash of its content, so editing it
# triggers a rebuild. `run --rebuild` forces one. The build context is empty,
# so COPY/ADD of local files won't work.
# build_file = "Dockerfile"
# build = """
# FROM docker.io/library/debian:trixie-slim
# RUN apt-get update && apt-get install -y --no-install-recommends ca-certificates curl git \\
#     && rm -rf /var/lib/apt/lists/*
# RUN curl -fsSL https://claude.ai/install.sh | bash
# ENV PATH=/root/.local/bin:$PATH
# """
# Default command when `agent-sandbox run` gets none. Unset means the image default.
command = ["bash"]
workdir = "/workspace"
# Relative and ~ paths are resolved against the current directory and $HOME.
# Bare names are named volumes and persist across runs.
volumes = [
    ".:/workspace:Z",
    "~/.claude:/root/.claude:Z",
    # Host CA bundle, e.g. for a TLS-inspecting corporate network. Squid only
    # tunnels HTTPS, so the agent's tools are the ones that must trust the CA.
    # On Fedora/RHEL hosts the source is /etc/pki/tls/certs/ca-bundle.crt.
    # No :Z/:z here, relabeling a system file breaks things on the host.
    # "/etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro",
]
# NAME=value sets a value, a bare NAME is copied from the host environment.
env = [
    "ANTHROPIC_API_KEY",
    "TERM=xterm-256color",
    "COLORTERM",
    # Skips optional telemetry and error reporting hosts the proxy would block anyway
    "CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC=1",
    # With the CA bundle above: Node tools (Codex, Pi, OpenCode) and Python
    # requests/pip use their own CA lists unless told otherwise.
    # "NODE_EXTRA_CA_CERTS=/etc/ssl/certs/ca-certificates.crt",
    # "REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt",
]
# Extra flags for `<engine> compose run`.
run_args = []

# Raw compose service keys, merged into the agent service.
# networks, network_mode and depends_on are rejected since they would break isolation.
[agent.service]
cap_drop = ["ALL"]
security_opt = ["no-new-privileges"]

[proxy]
# image = "docker.io/ubuntu/squid:latest"
# Port the proxy listens on (not a destination port, see allowed_ports)
# port = 3128
# Named domain lists for package registries, see `agent-sandbox presets`.
presets = ["claude-code", "debian", "uv", "npm"]
# Extra domains. A leading dot also allows all subdomains.
# allowed_domains = ["example.com", ".example.org"]
# IP addresses or networks (CIDR), for destinations without a name.
# allowed_ips = ["192.168.178.10", "10.0.0.0/8"]
# Destination ports allowed in addition to 80 and 443. They apply to every
# allowed destination.
# allowed_ports = [11434]
#
# To reach a service on the host, allow host.containers.internal (rootless
# podman) as a domain plus the service's port. The host's LAN IP may not work
# with rootless podman, since the container network can reuse that address.
# allowed_domains = ["host.containers.internal"]

# Resolve all allowed names (not wildcards) on the host at startup and pin the
# addresses in the proxy's /etc/hosts. Use this when the host resolves names
# the container can't, e.g. internal domains via VPN or split DNS. Addresses
# stay fixed for the session; names that fail to resolve fall back to the
# proxy's DNS.
# host_dns = true
