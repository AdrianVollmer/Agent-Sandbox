[project]
name = "agent-sandbox"
dynamic = ["version"]
description = "Run an agent in a sandboxed environment"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Adrian Vollmer", email = "dev@vllmr.org" },
]
dependencies = [
    "click>=8.1",
]

[project.scripts]
agent-sandbox = "agent_sandbox.__main__:main"

[dependency-groups]
dev = [
    "prek>=0.5",
    "pytest>=8.0",
    "ruff>=0.16",
    "ty>=0.0.1a0",
    "zensical>=0.0.62",
]

[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_sandbox"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = [
    "A",    # flake8-builtins
    "ARG",  # flake8-unused-arguments
    "B",    # flake8-bugbear
    "C4",   # flake8-comprehensions
    "D",    # pydocstyle
    "E",    # pycodestyle
    "ERA",  # eradicate (commented-out code)
    "F",    # pyflakes
    "FURB", # refurb
    "G",    # flake8-logging-format
    "I",    # isort
    "LOG",  # flake8-logging
    "N",    # pep8-naming
    "PLC",  # pylint
    "PTH",  # flake8-use-pathlib
    "RUF",  # ruff-specific rules
    "S",    # flake8-bandit
    "SIM",  # flake8-simplify
    "T20",  # flake8-print
    "TID",  # flake8-tidy-imports
    "TRY",  # tryceratops
    "UP",   # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "D", "S101"]

"src/agent_sandbox/cli.py" = ["PLC0415"]


[tool.ruff.format]
quote-style = "double"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ty.environment]
python-version = "3.12"
